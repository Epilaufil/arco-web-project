<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epilaufil | L'épilation au fil à Issy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --violet: #6c5ce7;
            --rose-bonbon: #ffdef2;
            --rose-fonce: #f8a5c2;
            --white: #ffffff;
            --dark: #2d3436;
            --glass: rgba(255, 255, 255, 0.85);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            background-color: #fffafd;
            color: var(--dark);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* --- NAVBAR AVEC VIDÉO --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            z-index: 1000;
            overflow: hidden;
            background: var(--white);
            border-bottom: 1px solid var(--rose-bonbon);
            display: flex;
            align-items: center;
        }

        .video-bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background: var(--violet);
        }

        .nav-video {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.5;
        }

        .nav-content {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo a { 
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--violet) !important;
            text-decoration: none;
            letter-spacing: 1.5px;
        }

        .nav-links a { 
            text-decoration: none; 
            color: var(--dark) !important; 
            font-size: 0.85rem; 
            font-weight: 700; 
            margin-left: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--rose-fonce) !important; }

        /* --- BACKGROUND BLOBS --- */
        .glass-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            filter: blur(80px);
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            animation: float 20s infinite alternate ease-in-out;
            opacity: 0.5;
        }
        .pink { width: 400px; height: 400px; background: var(--rose-bonbon); top: -100px; left: -100px; }
        .purple { width: 500px; height: 500px; background: var(--violet); bottom: -150px; right: -100px; animation-delay: -5s; }
        .light { width: 300px; height: 300px; background: #fff; top: 40%; left: 30%; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* --- CONTAINER & BRIQUES --- */
        .container {
            position: relative;
            z-index: 10;
            margin-top: 120px;
            padding: 20px;
            max-width: 1100px;
            margin-left: auto; margin-right: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .brique {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .brique.visible { opacity: 1; transform: translateY(0); }
        .brique:hover { transform: translateY(-8px); border-color: var(--rose-fonce); background: white; }

        /* PAILLETTES AU SURVOL */
        .brique::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 20% 30%, var(--rose-fonce) 100%, transparent),
                radial-gradient(1px 1px at 70% 10%, var(--violet) 100%, transparent),
                radial-gradient(1.5px 1.5px at 40% 80%, var(--rose-fonce) 100%, transparent),
                radial-gradient(1.5px 1.5px at 90% 45%, var(--violet) 100%, transparent);
            background-size: 150px 150px;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 1;
            pointer-events: none;
        }

        .brique:hover::after { opacity: 0.6; animation: sparkleFade 3s infinite alternate; }
        @keyframes sparkleFade { 0% { filter: brightness(1); transform: scale(1); } 100% { filter: brightness(1.5); transform: scale(1.05); } }

        .brique * { position: relative; z-index: 2; }

        /* --- GALERIE AVANT / APRES --- */
        .galerie-avant-apres {
            display: flex; flex-direction: column; gap: 20px; margin-top: 20px; align-items: center;
        }

        .cadre-photo { width: 100%; position: relative; }

        .photo-large {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #eee;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
