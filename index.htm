<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Projet ARCO</title>
    <style>
        body { background: #f4f4f4; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .brick { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; /* Style ARCO */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: translateY(20px);
            transition: 0.5s;
        }
    </style>
</head>
<body>
    <div class="brick">
        <h1>Bienvenue dans le projet ARCO</h1>
        <p>Ceci est ma première brique en cours de construction...</p>
    </div>
</body>
</html>
